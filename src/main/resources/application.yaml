server:
  port: 8080
logging:
  level.root: WARN
  level.no: ${LOG_LEVEL:INFO}
  level.org.springframework: WARN
  level.org.springframework.web: WARN
management:
  endpoints:
    web:
      base-path: /
      path-mapping:
        info: ping
        health: ready
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: catalog-backend
spring:
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRESQL_HOST}:${POSTGRESQL_PORT:5432}/${POSTGRESQL_DB:catalog_backend}
    username: ${POSTGRESQL_USER}
    password: ${POSTGRESQL_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_OIDC_ISSUER}
          jwk-set-uri: ${KEYCLOAK_OIDC_ISSUER}/protocol/openid-connect/certs
          audiences: catalog-backend
          authorities-claim-name: authorities
          authority-prefix: ""
          authorities-claim-delimiter: ","
application:
  catalogBackendUri: ${CATALOG_BACKEND_URI}
  organizationCatalogUri: ${ORGANIZATION_CATALOG_BASE_URI}
  harvestAdminUri: ${ADMIN_API_BASE_URI}
  cors.originPatterns: "${CORS_ORIGIN_PATTERNS}"

---
spring:
  config.activate.on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/catalog_backend
    username: root
    password: secret
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://auth.staging.fellesdatakatalog.digdir.no/realms/fdk
          jwk-set-uri: https://auth.staging.fellesdatakatalog.digdir.no/realms/fdk/protocol/openid-connect/certs
logging:
  level.no: DEBUG
application:
  catalogBackendUri: http://localhost:8080
  organizationCatalogUri: https://organization-catalog.staging.fellesdatakatalog.digdir.no
  harvestAdminUri: https://admin-api.staging.fellesdatakatalog.digdir.no
  cors.originPatterns: "*"

---
spring:
  config.activate.on-profile: test
  flyway:
    locations: classpath:db/migration,classpath:db/test-migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:5050/auth/realms/fdk
          jwk-set-uri: http://localhost:5050/auth/realms/fdk/protocol/openid-connect/certs
application:
  catalogBackendUri: http://localhost:5050
  organizationCatalogUri: http://localhost:5050
  harvestAdminUri: http://localhost:5050
  cors.originPatterns: "*"
